[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "networkluki-cyberlab"
version = "0.1.1"
description = "A local desktop workbench for scoped security research and static file analysis"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "NetworkLuki"}]
dependencies = ["PySide6-Essentials==6.12.0"]

[project.gui-scripts]
networkluki-cyberlab = "networkluki_cyberlab.ui:launch"

[tool.setuptools.packages.find]
include = ["networkluki_cyberlab*"]
